name: Testes — skills
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Testes por skill
        run: |
          set -e
          for item in skills/*; do
            (cd "$item" && python -m unittest discover -s evals -p 'test_*.py' -v)
          done
      - name: Cenários sintéticos congelados
        run: python reports/evaluate_frozen.py
